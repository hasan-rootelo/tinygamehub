<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Moto Rush · Tiny Game Hub</title>
<meta name="description" content="Race motorbikes through countryside, desert, city and snow. Dodge traffic, grab nitro, beat rival riders and earn stars in 10 races. Free, no download.">
<link rel="icon" href="/img/icon-192.png">
<meta name="theme-color" content="#1a1030">
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#120a24; color:#fff; font-family:system-ui, -apple-system, 'Segoe UI', sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
#cv { position:fixed; inset:0; width:100%; height:100%; display:block; }
.screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:18px; padding-top:max(18px, env(safe-area-inset-top)); background:rgba(14,8,30,.88); z-index:5; overflow:auto; }
.screen.show { display:flex; }
h1 { margin:0 0 6px; font-size:clamp(46px, 13vw, 86px); font-weight:900; font-style:italic; letter-spacing:1px; line-height:1;
  background:linear-gradient(#fff3c4, #ffcf3a 50%, #ff6a1a); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 0 #6a1d00) drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
h2 { margin:4px 0 10px; font-size:22px; font-weight:900; }
.btn { border:0; border-radius:18px; font:900 21px system-ui; padding:14px 34px; margin:6px; cursor:pointer; color:#fff; background:linear-gradient(#ff8a3a, #e8380e); box-shadow:0 5px 0 #8f1f00, 0 8px 18px rgba(0,0,0,.35); }
.btn:active { transform:translateY(3px); box-shadow:0 2px 0 #8f1f00; }
.btn.alt { background:linear-gradient(#ffe066, #f5b316); color:#4a2c00; box-shadow:0 5px 0 #a86f00; font-size:17px; padding:11px 24px; }
.btn.dark { background:linear-gradient(#4d5470, #2c3146); box-shadow:0 5px 0 #151827; font-size:17px; padding:11px 24px; }
#title { background:#2a1050 url(art/title.webp) center/cover no-repeat; justify-content:space-between; padding-bottom:max(36px, env(safe-area-inset-bottom)); }
#title h1 { margin-top:6vh; }
@media (orientation:landscape) { #title { background:url(art/title.webp) center/contain no-repeat, linear-gradient(#5a2a8a, #e85a2a); } }
#garage .bikes { display:grid; grid-template-columns:repeat(2, minmax(0, 220px)); gap:12px; margin:6px 0 10px; }
@media (min-width:900px) { #garage .bikes { grid-template-columns:repeat(4, 210px); } }
.bike { position:relative; border-radius:18px; padding:10px; background:rgba(255,255,255,.08); border:3px solid transparent; cursor:pointer; text-align:left; color:#fff; font-family:inherit; }
.bike.on { border-color:#ffcf3a; background:rgba(255,207,58,.14); }
.bike img { width:100%; aspect-ratio:4/3; object-fit:contain; display:block; }
.bike b { display:block; font-size:15px; margin:4px 0 6px; }
.bike .st { display:flex; align-items:center; gap:6px; font-size:11px; opacity:.85; margin:2px 0; }
.bike .st span:first-child { width:52px; }
.bike .bar { flex:1; height:7px; border-radius:4px; background:rgba(255,255,255,.15); overflow:hidden; }
.bike .bar i { display:block; height:100%; background:linear-gradient(90deg, #ffcf3a, #ff6a1a); }
.bike.locked img { filter:grayscale(1) brightness(.45); }
.bike .lock { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:900; font-size:14px; border-radius:15px; background:rgba(0,0,0,.35); }
.bike .lock big { font-size:28px; }
#levelGrid { display:grid; grid-template-columns:repeat(5, 64px); gap:10px; margin:8px 0 14px; }
#levelGrid button { height:72px; border-radius:16px; border:0; font:900 22px system-ui; color:#fff; cursor:pointer; position:relative; box-shadow:0 4px 0 rgba(0,0,0,.4); }
#levelGrid button small { position:absolute; left:0; right:0; bottom:4px; font-size:11px; color:#ffd23a; letter-spacing:-1px; }
#levelGrid button:disabled { filter:grayscale(1) brightness(.5); cursor:default; }
.w-country { background:linear-gradient(#5fc25a, #2f8a3a); } .w-desert { background:linear-gradient(#ffb04a, #d2551e); }
.w-city { background:linear-gradient(#4a6cff, #23268a); } .w-snow { background:linear-gradient(#a9dbff, #4f86c9); }
#starTotal { font-weight:900; color:#ffd23a; margin-bottom:4px; }
#resPic { height:min(30vh, 250px); }
#resStars { font-size:46px; letter-spacing:6px; margin:4px 0; color:#ffd23a; text-shadow:0 3px 0 #8a5a00; }
#resStars .off { color:rgba(255,255,255,.2); text-shadow:none; }
#resText { opacity:.9; margin:2px 0 10px; line-height:1.5; }
/* touch controls */
#pad { position:fixed; left:0; right:0; bottom:0; height:0; z-index:3; display:none; }
body[data-s="race"] #pad { display:block; }
.pb { position:fixed; bottom:max(16px, env(safe-area-inset-bottom)); width:clamp(64px, 18vw, 96px); height:clamp(64px, 18vw, 96px); border-radius:50%; border:3px solid rgba(255,255,255,.55); background:rgba(0,0,0,.28); color:#fff; font:900 28px system-ui; display:flex; align-items:center; justify-content:center; touch-action:none; }
.pb.on { background:rgba(255,255,255,.35); }
#bL { left:14px; } #bR { left:calc(28px + clamp(64px, 18vw, 96px)); }
#bGas { right:14px; background:rgba(40,190,80,.45); width:clamp(72px, 20vw, 108px); height:clamp(72px, 20vw, 108px); }
#bBrake { right:calc(28px + clamp(72px, 20vw, 108px)); background:rgba(220,40,40,.4); font-size:15px; }
#topbar { position:fixed; top:max(8px, env(safe-area-inset-top)); right:8px; z-index:4; display:none; gap:6px; }
body[data-s="race"] #topbar { display:flex; }
#topbar button { width:42px; height:42px; border-radius:14px; border:0; background:rgba(0,0,0,.4); color:#fff; font-size:19px; cursor:pointer; }
</style>
</head>
<body data-s="title">
<canvas id="cv"></canvas>
<div id="pad"><div class="pb" id="bL">◀</div><div class="pb" id="bR">▶</div><div class="pb" id="bBrake">STOP</div><div class="pb" id="bGas">▲</div></div>
<div id="topbar"><button id="bSound" aria-label="Sound">🔊</button><button id="bPause" aria-label="Pause">❚❚</button></div>

<div class="screen show" id="title">
  <h1>MOTO RUSH</h1>
  <div><button class="btn" id="bPlay">PLAY ▶</button></div>
</div>

<div class="screen" id="garage">
  <h2>Choose your bike</h2>
  <div id="starTotal"></div>
  <div class="bikes" id="bikes"></div>
  <button class="btn" id="bGarageGo">NEXT ▶</button>
  <button class="btn dark" id="bGarageBack">Back</button>
</div>

<div class="screen" id="levels">
  <h2>Choose a race</h2>
  <div id="levelGrid"></div>
  <button class="btn dark" id="bLevelsBack">◀ Bikes</button>
</div>

<div class="screen" id="pause">
  <h2>Paused</h2>
  <button class="btn" id="bResume">Resume ▶</button>
  <button class="btn alt" id="bRetry">Restart race</button>
  <button class="btn dark" id="bQuit">Races</button>
</div>

<div class="screen" id="result">
  <img id="resPic" src="art/win.webp" alt="">
  <h1 id="resTitle" style="font-size:42px">FINISHED!</h1>
  <div id="resStars"></div>
  <div id="resText"></div>
  <div><button class="btn" id="bNext">Next race ▶</button></div>
  <div><button class="btn alt" id="bAgain">Race again</button><button class="btn dark" id="bResLevels">Races</button></div>
</div>

<script>
'use strict';
const TEST_MODE = /[?&]test\b/.test(location.search);   // add ?test to the address to open every race and bike
const $ = q => document.querySelector(q);
const cv = $('#cv'), cx = cv.getContext('2d');

/* ================= pictures ================= */
const SIZES = {"bike1_l":[325,420],"bike1_s":[246,420],"bike1_r":[310,420],"bike2_l":[325,420],"bike2_s":[245,420],"bike2_r":[306,420],"bike3_l":[361,420],"bike3_s":[272,420],"bike3_r":[329,420],"bike4_l":[296,420],"bike4_s":[226,420],"bike4_r":[261,420],"rival1":[219,380],"rival2":[219,380],"rival3":[219,380],"car1":[348,360],"car2":[364,420],"car3":[391,420],"car4":[339,420],"country1":[383,420],"country2":[274,420],"country3":[294,242],"country4":[306,199],"country5":[314,206],"country6":[420,388],"desert1":[253,420],"desert2":[291,420],"desert3":[368,339],"desert4":[346,226],"desert5":[311,398],"desert6":[397,420],"city1":[160,420],"city2":[265,420],"city3":[246,420],"city4":[388,420],"city5":[352,330],"city6":[281,420],"snow1":[314,420],"snow2":[262,420],"snow3":[319,420],"snow4":[360,258],"snow5":[420,407],"snow6":[208,420],"nitro":[209,400],"coin":[396,400],"finish":[533,453]};
const IMG = {};
const NAMES = Object.keys(SIZES).concat(['sky_country', 'sky_desert', 'sky_city', 'sky_snow']);
NAMES.forEach(n => { const im = new Image(); im.src = 'art/' + n + '.webp'; IMG[n] = im; });
const ok = n => IMG[n] && IMG[n].complete && IMG[n].naturalWidth > 0;

/* ================= worlds, bikes, levels ================= */
// props: [picture, height in road units, chance]
const WORLDS = {
  country: { sky: 'sky_country', grass: ['#62c23e', '#56b234'], road: ['#6e6f75', '#686970'], rumble: ['#e83a3a', '#ffffff'], lane: '#ffffff', haze: '#bfe3ff',
    props: [['country1', 3200, 3], ['country2', 3400, 3], ['country3', 1300, 2], ['country4', 1100, 2], ['country5', 900, 2], ['country6', 3000, .6]] },
  desert: { sky: 'sky_desert', grass: ['#e8b46a', '#dca85e'], road: ['#7c7068', '#756962'], rumble: ['#e83a3a', '#ffffff'], lane: '#fff3d6', haze: '#ffc59a',
    props: [['desert1', 2100, 3], ['desert2', 3800, 2], ['desert3', 2400, 2], ['desert4', 1400, 2], ['desert5', 1500, 1], ['desert6', 2600, .6]] },
  city: { sky: 'sky_city', grass: ['#3a3f50', '#343849'], road: ['#2e313b', '#2a2d36'], rumble: ['#ffcf2a', '#222222'], lane: '#ffd84a', haze: '#2a3a7a',
    props: [['city1', 3000, 4], ['city2', 7200, 2], ['city3', 6200, 2], ['city4', 2800, 1], ['city5', 1800, 1], ['city6', 2800, 2]] },
  snow: { sky: 'sky_snow', grass: ['#f1f6fd', '#e3ecf7'], road: ['#6f7782', '#68707b'], rumble: ['#e83a3a', '#ffffff'], lane: '#ffffff', haze: '#d9ecff',
    props: [['snow1', 3200, 3], ['snow2', 3800, 3], ['snow3', 1400, 1], ['snow4', 1300, 2], ['snow5', 3000, .6], ['snow6', 1200, 1.5]] }
};
const BIKES = [
  { name: 'Red Racer', img: 'bike1', top: 1.0, acc: 1.0, grip: 1.0, tough: 1.0, off: 1.0, need: 0 },
  { name: 'Dirt King', img: 'bike4', top: .93, acc: 1.18, grip: 1.25, tough: 1.1, off: 2.2, need: 5 },
  { name: 'Iron Cruiser', img: 'bike3', top: .97, acc: .85, grip: .95, tough: 1.7, off: 1.0, need: 12 },
  { name: 'Blue Storm', img: 'bike2', top: 1.13, acc: 1.08, grip: .9, tough: .9, off: .9, need: 20 }
];
const LEVELS = [
  // swap: chance a car changes lane; obst: road obstacles per km; ice: slippery
  { name: 'Green Valley', w: 'country', len: 3900, curve: .6, hill: .4, traffic: .22, rivals: 2, nitro: 3 },
  { name: 'Hill Run', w: 'country', len: 4500, curve: .9, hill: .8, traffic: .32, rivals: 3, nitro: 3 },
  { name: 'Canyon Road', w: 'desert', len: 4800, curve: .9, hill: .5, traffic: .36, rivals: 3, nitro: 3 },
  { name: 'Sunset Mesa', w: 'desert', len: 5250, curve: 1.15, hill: .9, traffic: .45, rivals: 3, nitro: 4 },
  { name: 'Downtown Night', w: 'city', len: 5250, curve: .9, hill: .3, traffic: .65, rivals: 3, nitro: 4 },
  { name: 'Neon Rush', w: 'city', len: 5700, curve: 1.25, hill: .5, traffic: .8, rivals: 3, nitro: 4 },
  { name: 'Frosty Pass', w: 'snow', len: 5700, curve: 1.25, hill: 1.1, traffic: .45, rivals: 3, nitro: 4 },
  { name: 'Glacier Bends', w: 'snow', len: 6150, curve: 1.5, hill: 1.2, traffic: .55, rivals: 3, nitro: 5 },
  { name: 'Desert Storm', w: 'desert', len: 6450, curve: 1.55, hill: 1.1, traffic: .75, rivals: 3, nitro: 5 },
  { name: 'Summit Final', w: 'snow', len: 6900, curve: 1.75, hill: 1.35, traffic: .85, rivals: 3, nitro: 5 }
];

/* ================= save ================= */
const KEY = 'motorush:v1';
let save = { stars: {}, best: {}, bike: 0, sound: true };
try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { }
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { } };
const totalStars = () => Object.values(save.stars).reduce((a, b) => a + b, 0);
const bikeOpen = i => TEST_MODE || totalStars() >= BIKES[i].need;
const levelOpen = i => TEST_MODE || i === 0 || (save.stars[i - 1] || 0) > 0;

/* ================= road engine (classic behind-the-bike racer) ================= */
const SEG = 200, RUMBLE = 3, ROADW = 2000, LANES = 3, DRAW = 220, FOV = 100;
const CAM_DEPTH = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const MAXV = SEG * 60;                           // top speed of a "1.0" bike, road units per second
let segs = [], trackLen = 0, finishZ = 0, cars = [], items = [], L = null, WD = null, B = BIKES[0];
let W = 0, H = 0, DPR = 1, HOR = 0, F = 1, camH = 1000, playerZ = 1000;
let rnd = Math.random;
function seeded(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
const easeIn = (a, b, p) => a + (b - a) * p * p, easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + .5);
const lastY = () => segs.length ? segs[segs.length - 1].p2.y : 0;
function addSeg(curve, y) {
  const n = segs.length;
  segs.push({ i: n, p1: { y: lastY(), z: n * SEG, s: {} }, p2: { y, z: (n + 1) * SEG, s: {} }, curve, sprites: [], cars: [], dark: Math.floor(n / RUMBLE) % 2 });
}
function addRoad(enter, hold, leave, curve, hill) {
  const y0 = lastY(), y1 = y0 + hill * SEG, tot = enter + hold + leave;
  for (let k = 0; k < enter; k++) addSeg(easeIn(0, curve, k / enter), easeInOut(y0, y1, k / tot));
  for (let k = 0; k < hold; k++) addSeg(curve, easeInOut(y0, y1, (enter + k) / tot));
  for (let k = 0; k < leave; k++) addSeg(easeInOut(curve, 0, k / leave), easeInOut(y0, y1, (enter + hold + k) / tot));
}
function buildTrack(li) {
  L = LEVELS[li]; WD = WORLDS[L.w]; rnd = seeded(1234 + li * 977);
  segs = []; cars = []; items = [];
  addRoad(30, 40, 30, 0, 0);                                   // start straight
  while (segs.length < L.len - 160) {
    const r = rnd(), n = 25 + (rnd() * 50 | 0), c = (rnd() < .5 ? -1 : 1) * Math.min(6, (1 + rnd() * 3.5) * L.curve), h = (rnd() - .5) * 60 * L.hill;
    if (r < .25) addRoad(n, n, n, 0, h * .6);
    else if (r < .75) addRoad(n, n, n, c, h);
    else { addRoad(n * .6 | 0, n * .5 | 0, n * .6 | 0, c, h); addRoad(n * .6 | 0, n * .5 | 0, n * .6 | 0, -c, -h * .5); }
  }
  addRoad(40, 60, 40, 0, -lastY() / SEG * .5);                // home straight
  addRoad(60, 60, 0, 0, 0);
  trackLen = segs.length * SEG; finishZ = (segs.length - 90) * SEG;
  // roadside scenery
  const props = WD.props, wsum = props.reduce((a, p) => a + p[2], 0);
  const pick = () => { let r = rnd() * wsum; for (const p of props) { if ((r -= p[2]) <= 0) return p; } return props[0]; };
  for (let n = 10; n < segs.length; n += 3 + (rnd() * 4 | 0)) {
    for (const side of [-1, 1]) {
      if (rnd() < .25) continue;
      const p = pick(), [iw, ih] = SIZES[p[0]], h = p[1], w = h * iw / ih;
      const big = h > 4000, off = side * (1.25 + rnd() * (big ? 1.6 : 1.1) + w / ROADW * .5 + (big ? .9 : 0));
      segs[n].sprites.push({ img: p[0], off, w, h, solid: !(p[0] === 'country4' && 0) });
    }
  }
  // finish arch over the road
  const fs = segs[Math.floor(finishZ / SEG)], fw = ROADW * 2.6;
  fs.sprites.push({ img: 'finish', off: 0, w: fw, h: fw * SIZES.finish[1] / SIZES.finish[0], arch: true });
  // traffic
  const nCars = Math.round(L.len / 70 * L.traffic);
  const hard = li / (LEVELS.length - 1);                       // 0 in race 1 .. 1 in race 10
  L.ice = L.w === 'snow'; L.swap = li >= 3 ? .02 + hard * .06 : 0; L.rivalNitro = li >= 3; L.block = li >= 5;
  for (let k = 0; k < nCars; k++) {
    const kind = 1 + (rnd() * 4 | 0), lane = [-.66, 0, .66][rnd() * 3 | 0];
    const w = { 1: 760, 2: 820, 3: 790, 4: 900 }[kind];
    cars.push({ img: 'car' + kind, off: lane + (rnd() - .5) * .1, lane, z: (40 + rnd() * (segs.length - 160)) * SEG, v: MAXV * (.28 + hard * .14 + rnd() * .3), sig: 0, w, h: w * SIZES['car' + kind][1] / SIZES['car' + kind][0], rival: false });
  }
  // rivals start on the grid next to and ahead of the player
  for (let k = 0; k < L.rivals; k++) {
    const w = 430;
    cars.push({ img: 'rival' + (k + 1), off: [-.5, .5, -.1][k], z: (8 + k * 7) * SEG, v: 0, vmax: MAXV * Math.min(.99, .88 + k * .02 + li * .008), w, h: w * SIZES['rival1'][1] / SIZES['rival1'][0], rival: true, name: ['Yellow', 'Purple', 'White'][k], fin: 0 });
  }
  // nitro bottles and coin lines
  for (let k = 0; k < L.nitro; k++) items.push({ kind: 'nitro', z: ((k + 1) / (L.nitro + 1)) * finishZ * .95, off: [-.6, 0, .6][rnd() * 3 | 0], w: 420, got: false });
  for (let z = 80 * SEG; z < finishZ - 40 * SEG; z += (150 + rnd() * 150 | 0) * SEG) {
    const off = [-.6, 0, .6][rnd() * 3 | 0];
    for (let k = 0; k < 5; k++) items.push({ kind: 'coin', z: z + k * 6 * SEG, off, w: 360, got: false });
  }
  for (const it of items) it.h = it.w * SIZES[it.kind][1] / SIZES[it.kind][0];
  // obstacles from race 3: oil patches everywhere, cones and barriers in the city and snow
  if (li >= 2) {
    const per = 300 - hard * 130;
    for (let z = 120 * SEG; z < finishZ - 60 * SEG; z += (per * (.6 + rnd() * .8) | 0) * SEG) {
      const lane = [-.66, 0, .66][rnd() * 3 | 0], r = rnd(), urban = L.w === 'city' || L.w === 'snow';
      if (urban && r < .35) items.push({ kind: 'barrier', z, off: lane, w: 900, h: 420 });
      else if (urban && r < .7) for (let k = 0; k < 3; k++) items.push({ kind: 'cone', z: z + k * 3 * SEG, off: lane + (k - 1) * .18, w: 170, h: 260 });
      else items.push({ kind: 'oil', z, off: lane, w: 1000, h: 0 });
    }
  }
}
const segAt = z => segs[Math.floor(z / SEG) % segs.length];

/* ================= race state ================= */
let race = null;
const input = { l: false, r: false, gas: false, brake: false };
function startRace(li) {
  buildTrack(li);
  race = { li, z: 0, x: 0, v: 0, t: 0, count: 3.5, coins: 0, nitro: 0, crash: 0, done: false, skyX: 0, lean: 0, shake: 0, place: L.rivals + 1, finishT: 0, slide: 0, slideDir: 0 };
  B = BIKES[save.bike] || BIKES[0];
  show(null); document.body.dataset.s = 'race'; resize(); engineOn();
}
function overlap(x1, w1, x2, w2) { return Math.abs(x1 - x2) < (w1 + w2) / 2; }
function crash(power) {
  if (race.crash > 0) return;
  race.v *= Math.min(.6, .22 * B.tough * (power || 1)); race.crash = .9; race.shake = .5; sCrash();
}
function update(dt) {
  if (!race || race.done && race.finishT > 2.2) return;
  const R = race, top = MAXV * B.top * (R.nitro > 0 ? 1.35 : 1);
  if (R.count > -1) { const c0 = Math.ceil(R.count); R.count -= dt; const c1 = Math.ceil(R.count); if (c1 !== c0 && c0 > 0) sBeep(c1 > 0 ? 440 : 880); if (R.count > 0) { moveCars(dt, true); return; } }
  if (!R.done) R.t += dt; else R.finishT += dt;
  const seg = segAt(R.z + playerZ), pct = R.v / (MAXV * B.top);
  const steer = R.done ? 0 : (input.l ? -1 : 0) + (input.r ? 1 : 0);
  // steering + the road pushing you outwards on curves
  const slip = (L.ice ? 1.2 : 1) * (R.slide > 0 ? 1.8 : 1);
  R.x += steer * dt * 2.2 * Math.min(1, pct * 1.6 + .25) / (L.ice ? 1.15 : 1);
  R.x -= dt * 2 * pct * seg.curve * .2 * slip / B.grip;
  if (R.slide > 0) { R.slide -= dt; R.x += R.slideDir * dt * 1.3 * pct; R.lean = R.slideDir * 1.2; }

  // speed

  $('#resStars').innerHTML = [0, 1, 2].map(k => `<span class="${k < stars ? '' : 'off'}">★</span>`).join('');
  $('#resText').innerHTML = `Time ${fmt(R.finalT)} &nbsp;·&nbsp; ${R.coins} coins = −${(R.coins * .1).toFixed(1)}s<br><b>Your time ${fmt(t)}</b> &nbsp;·&nbsp; ${['1st', '2nd', '3rd', '4th'][R.finalPlace - 1]} place<br><small>★ ${fmt(T[2])} &nbsp; ★★ ${fmt(T[1])} &nbsp; ★★★ ${fmt(T[0])}</small>`;
  $('#bNext').style.display = stars && li < LEVELS.length - 1 ? '' : 'none';
  race = null; show('result'); document.body.dataset.s = 'result';
  if (stars) sWin();
}

/* ================= sound (made in code) ================= */
let AC = null, eng = null;
function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type = 'sine', v = .15, slide = 0, delay = 0) {
  if (!save.sound) return;
  try { ac(); const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); } catch (e) { }
}
function noiseHit(d, v, f) {
  if (!save.sound) return;
  try { ac(); const n = AC.createBuffer(1, AC.sampleRate * d, AC.sampleRate), ch = n.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length); const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = n; fl.type = 'lowpass'; fl.frequency.value = f; g.gain.value = v; s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(); } catch (e) { }
}
const sBeep = f => tone(f, .25, 'square', .08);
const sCrash = () => { noiseHit(.5, .5, 900); tone(110, .4, 'sawtooth', .12, .5); };
const sCoin = () => { tone(1320, .08, 'square', .06); tone(1760, .12, 'square', .05, 1, .06); };
const sNitro = () => { noiseHit(.8, .35, 3000); tone(300, .7, 'sawtooth', .07, 3); };
const sSkid = () => { noiseHit(.7, .25, 2400); tone(900, .5, 'sawtooth', .03, .6); };
const sCone = () => { tone(300, .12, 'square', .08, .6); noiseHit(.15, .2, 1500); };
const sFinish = () => [523, 659, 784, 1046].forEach((f, k) => tone(f, .25, 'triangle', .14, 1, k * .12));
const sWin = () => [784, 1046, 1318].forEach((f, k) => tone(f, .4, 'triangle', .12, 1, k * .15));
function engineOn() {
  if (!save.sound || eng) return;
  try {
    ac(); const o = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 700; g.gain.value = 0;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(AC.destination); o.start(); o2.start();
    eng = { o, o2, f, g };
  } catch (e) { }
}
function engineTune(p, boost) { if (!eng) return; const t = AC.currentTime, f = 55 + p * 150 + (boost ? 40 : 0); eng.o.frequency.setTargetAtTime(f, t, .05); eng.o2.frequency.setTargetAtTime(f * .5, t, .05); eng.f.frequency.setTargetAtTime(500 + p * 1400, t, .1); eng.g.gain.setTargetAtTime(race && race.count <= 0 ? .045 + p * .03 : .03, t, .1); }
function engineOff() { if (!eng) return; try { eng.g.gain.setTargetAtTime(0, AC.currentTime, .05); const e = eng; setTimeout(() => { e.o.stop(); e.o2.stop(); }, 300); } catch (e) { } eng = null; }

/* ================= controls ================= */
function bindPad(id, k) {
  const el = $(id);
  const on = e => { e.preventDefault(); input[k] = true; el.classList.add('on'); ac(); };
  const off = e => { e.preventDefault(); input[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindPad('#bL', 'l'); bindPad('#bR', 'r'); bindPad('#bGas', 'gas'); bindPad('#bBrake', 'brake');
const KEYS = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'gas', KeyW: 'gas', Space: 'gas', ArrowDown: 'brake', KeyS: 'brake' };
addEventListener('keydown', e => { if (KEYS[e.code]) { input[KEYS[e.code]] = true; e.preventDefault(); ac(); } if (e.code === 'Escape' && race) pauseGame(); });
addEventListener('keyup', e => { if (KEYS[e.code]) input[KEYS[e.code]] = false; });

/* ================= screens ================= */
let paused = false;
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('show', s.id === id)); if (id) document.body.dataset.s = id; }
function garageUI() {
  $('#starTotal').textContent = `★ ${totalStars()} stars`;
  $('#bikes').innerHTML = BIKES.map((b, i) => {
    const open = bikeOpen(i), st = [['Speed', b.top / 1.13], ['Accel', b.acc / 1.18], ['Grip', b.grip / 1.25], ['Strength', b.tough / 1.7]];
    return `<button class="bike ${save.bike === i ? 'on' : ''} ${open ? '' : 'locked'}" data-b="${i}"><img src="art/${b.img}_side.webp" alt=""><b>${b.name}</b>${st.map(([n, v]) => `<div class="st"><span>${n}</span><div class="bar"><i style="width:${Math.round(v * 100)}%"></i></div></div>`).join('')}${open ? '' : `<div class="lock"><big>🔒</big>${b.need} ★ to unlock</div>`}</button>`;
  }).join('');
}
$('#bikes').addEventListener('click', e => { const b = e.target.closest('.bike'); if (!b) return; const i = +b.dataset.b; if (!bikeOpen(i)) return; save.bike = i; persist(); garageUI(); tone(660, .08, 'square', .05); });
function levelsUI() {
  $('#levelGrid').innerHTML = LEVELS.map((l, i) => { const st = save.stars[i] || 0; return `<button class="w-${l.w}" data-l="${i}" ${levelOpen(i) ? '' : 'disabled'} title="${l.name}">${i + 1}<small>${'★'.repeat(st)}${'☆'.repeat(3 - st)}</small></button>`; }).join('');
}
$('#levelGrid').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) startRace(+b.dataset.l); });
$('#bPlay').onclick = () => { ac(); garageUI(); show('garage'); };
$('#bGarageGo').onclick = () => { levelsUI(); show('levels'); };
$('#bGarageBack').onclick = () => show('title');
$('#bLevelsBack').onclick = () => { garageUI(); show('garage'); };
function pauseGame() { if (!race) return; paused = true; engineOff(); show('pause'); }
$('#bPause').onclick = pauseGame;
$('#bResume').onclick = () => { paused = false; show(null); document.body.dataset.s = 'race'; engineOn(); };
$('#bRetry').onclick = () => { paused = false; startRace(race.li); };
$('#bQuit').onclick = () => { paused = false; race = null; engineOff(); levelsUI(); show('levels'); };
let lastLi = 0;
const _start = startRace; startRace = li => { lastLi = li; for (const k in input) input[k] = false; _start(li); };
$('#bNext').onclick = () => startRace(Math.min(LEVELS.length - 1, lastLi + 1));
$('#bAgain').onclick = () => startRace(lastLi);
$('#bResLevels').onclick = () => { levelsUI(); show('levels'); };
$('#bSound').onclick = () => { save.sound = !save.sound; persist(); $('#bSound').textContent = save.sound ? '🔊' : '🔇'; if (save.sound) engineOn(); else engineOff(); };
$('#bSound').textContent = save.sound ? '🔊' : '🔇';
document.addEventListener('visibilitychange', () => { if (document.hidden && race && !paused) pauseGame(); });

/* ================= loop ================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (race && !paused) { const n = 2; for (let k = 0; k < n; k++) update(dt / n); }
  render();
  requestAnimationFrame(loop);
}
resize(); requestAnimationFrame(loop);
window.__moto = { get race() { return race; }, input, startRace, cars: () => cars, items: () => items, segAt, get playerZ() { return playerZ; }, starTimes, LEVELS, save };
</script>
